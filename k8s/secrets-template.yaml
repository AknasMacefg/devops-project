apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: devops-demo
type: Opaque
stringData:
  DJANGO_SECRET_KEY: change-me
  POSTGRES_PASSWORD: reaction_game
  # RSA keys live outside the app source tree.
  # Mount updater private key into /keys in updater-service and public key into /keys in security-service.
  # If you want mTLS, mount certs under /certs and set UPDATE_MTLS_ENABLED / SECURITY_MTLS_ENABLED to 1.
  UPDATER_RSA_PRIVATE_KEY_PATH: ""
  SECURITY_RSA_PUBLIC_KEY_PATH: ""
