apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app
  namespace: devops-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: django-app }
  template:
    metadata:
      labels: { app: django-app }
    spec:
      containers:
        - name: django-app
          image: django-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: app-secrets, key: DJANGO_SECRET_KEY } }
            - name: DJANGO_DEBUG
              value: "1"
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: UPDATE_MTLS_ENABLED
              valueFrom: { configMapKeyRef: { name: app-config, key: UPDATE_MTLS_ENABLED } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_PORT } }
            - name: REDIS_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: REDIS_URL } }
            - name: UPDATE_SECURITY_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: UPDATE_SECURITY_SERVICE_URL } }
            - name: UPDATE_POLICY_ALLOWED_MODULES
              valueFrom: { configMapKeyRef: { name: app-config, key: UPDATE_POLICY_ALLOWED_MODULES } }
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: django-app
  namespace: devops-demo
spec:
  selector: { app: django-app }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: devops-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: nginx }
  template:
    metadata:
      labels: { app: nginx }
    spec:
      containers:
        - name: nginx
          image: nginx-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: devops-demo
spec:
  type: NodePort
  selector: { app: nginx }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
