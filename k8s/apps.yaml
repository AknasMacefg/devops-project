apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: devops-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: devops-demo
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: devops-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: devops-demo
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: updater-service
  namespace: devops-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: updater-service }
  template:
    metadata:
      labels: { app: updater-service }
    spec:
      containers:
        - name: updater-service
          image: updater-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: UPDATER_PORT
              value: "8001"
            - name: UPDATER_PUBLIC_HOST
              value: updater-service:8001
            - name: UPDATER_MTLS_ENABLED
              valueFrom: { configMapKeyRef: { name: app-config, key: UPDATE_MTLS_ENABLED } }
            - name: UPDATER_RSA_PRIVATE_KEY_PATH
              valueFrom: { secretKeyRef: { name: app-secrets, key: UPDATER_RSA_PRIVATE_KEY_PATH } }
          ports:
            - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: updater-service
  namespace: devops-demo
spec:
  selector: { app: updater-service }
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-service
  namespace: devops-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: security-service }
  template:
    metadata:
      labels: { app: security-service }
    spec:
      containers:
        - name: security-service
          image: security-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SECURITY_PORT
              value: "8002"
            - name: SECURITY_MTLS_ENABLED
              valueFrom: { configMapKeyRef: { name: app-config, key: SECURITY_MTLS_ENABLED } }
            - name: UPDATE_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: UPDATE_SERVICE_URL } }
            - name: SECURITY_RSA_PUBLIC_KEY_PATH
              valueFrom: { secretKeyRef: { name: app-secrets, key: SECURITY_RSA_PUBLIC_KEY_PATH } }
            - name: SECURITY_RSA_VERIFY_REQUIRED
              valueFrom: { configMapKeyRef: { name: app-config, key: SECURITY_RSA_VERIFY_REQUIRED } }
            - name: STRICT_TIME_BOMB_CHECK
              valueFrom: { configMapKeyRef: { name: app-config, key: STRICT_TIME_BOMB_CHECK } }
          ports:
            - containerPort: 8002
          volumeMounts:
            - name: update-artifacts
              mountPath: /artifacts
      volumes:
        - name: update-artifacts
          persistentVolumeClaim:
            claimName: update-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: security-service
  namespace: devops-demo
spec:
  selector: { app: security-service }
  ports:
    - port: 8002
      targetPort: 8002
---
