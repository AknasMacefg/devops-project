x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      <<: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app-net

  updater-service:
    build:
      context: ./updater_service
    environment:
      UPDATER_PUBLIC_HOST: ${UPDATER_PUBLIC_HOST:-updater-service:8001}
      UPDATER_PORT: 8001
      UPDATER_MTLS_ENABLED: ${MTLS_ENABLED:-0}
      UPDATER_RSA_PRIVATE_KEY_PATH: ${UPDATER_RSA_PRIVATE_KEY_PATH:-/keys/updater_private.pem}
      UPDATER_TLS_CERT_FILE: ${UPDATER_TLS_CERT_FILE:-/certs/updater/updater.crt}
      UPDATER_TLS_KEY_FILE: ${UPDATER_TLS_KEY_FILE:-/certs/updater/updater.key}
      UPDATER_TLS_CA_FILE: ${UPDATER_TLS_CA_FILE:-/certs/ca/ca.crt}
    ports:
      - "8001:8001"
    volumes:
      - ./keys:/keys:ro
      - ./certs/updater:/certs/updater:ro
      - ./certs/ca:/certs/ca:ro
    networks:
      - app-net

  security-service:
    build:
      context: ./security_service
    environment:
      SECURITY_PORT: 8002
      SECURITY_MTLS_ENABLED: ${MTLS_ENABLED:-0}
      UPDATE_SERVICE_URL: ${UPDATE_SERVICE_URL:-http://updater-service:8001}
      SECURITY_RSA_PUBLIC_KEY_PATH: ${SECURITY_RSA_PUBLIC_KEY_PATH:-/keys/updater_public.pem}
      SECURITY_RSA_VERIFY_REQUIRED: ${SECURITY_RSA_VERIFY_REQUIRED:-0}
      STRICT_TIME_BOMB_CHECK: ${STRICT_TIME_BOMB_CHECK:-0}
      SECURITY_TLS_CLIENT_CERT_FILE: ${SECURITY_TLS_CLIENT_CERT_FILE:-/certs/security/security.crt}
      SECURITY_TLS_CLIENT_KEY_FILE: ${SECURITY_TLS_CLIENT_KEY_FILE:-/certs/security/security.key}
      SECURITY_TLS_CA_FILE: ${SECURITY_TLS_CA_FILE:-/certs/ca/ca.crt}
    ports:
      - "8002:8002"
    depends_on:
      - updater-service
    volumes:
      - update_artifacts:/artifacts:rw
      - ./keys:/keys:ro
      - ./certs/security:/certs/security:ro
      - ./certs/ca:/certs/ca:ro
    networks:
      - app-net
      - sandbox-net

  worker:
    build:
      context: ./worker_service
    environment:
      WORKER_PORT: 8003
    networks:
      - sandbox-net
    volumes:
      - update_artifacts:/artifacts:rw

  django-app:
    build:
      context: ./django_app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      UPDATE_MTLS_ENABLED: ${MTLS_ENABLED:-0}
      <<: *postgres-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      UPDATE_SECURITY_SERVICE_URL: ${UPDATE_SECURITY_SERVICE_URL:-http://security-service:8002}
      UPDATE_POLICY_ALLOWED_MODULES: ${UPDATE_POLICY_ALLOWED_MODULES:-safe_update}
    volumes:
      - ./django_app:/app
      - django_static:/app/staticfiles
      - django_media:/app/media
    depends_on:
      - postgres
      - redis
      - security-service
    networks:
      - app-net

  nginx:
    build:
      context: ./nginx
    depends_on:
      - django-app
    ports:
      - "8080:80"
    volumes:
      - django_static:/staticfiles:ro
      - django_media:/media:ro
    networks:
      - app-net

volumes:
  postgres_data:
  redis_data:
  django_static:
  django_media:
  update_artifacts:

networks:
  app-net:
    driver: bridge
  sandbox-net:
    driver: bridge
    internal: true
