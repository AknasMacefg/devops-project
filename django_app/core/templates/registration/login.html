{% extends 'core/base.html' %}
{% block title %}Reaction Guard | Вход{% endblock %}
{% block content %}
<section class="auth-card">
    <div>
        <p class="eyebrow">С возвращением</p>
        <h1>Вход</h1>
        <p class="lead">Используйте свой аккаунт, чтобы играть, сохранять результаты и открывать таблицу лидеров.</p>
    </div>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <label>{{ form.username.label_tag }}{{ form.username }}</label>
        <label>{{ form.password.label_tag }}{{ form.password }}</label>
        <button type="submit" class="button-link primary full-width">Войти</button>
    </form>
</section>
{% endblock %}
